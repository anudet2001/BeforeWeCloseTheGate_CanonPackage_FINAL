name: Test and verify FINAL package

on:
  push:
    paths:
      - '**/manifest.json'
      - '**/manifest.sha256'
      - '**/manifest.schema.json'
      - 'Tools/*.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/verify-manifest.yml'
      - '*.zip'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/manifest.json'
      - '**/manifest.sha256'
      - '**/manifest.schema.json'
      - 'Tools/*.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/verify-manifest.yml'
      - '*.zip'
  workflow_dispatch:
    inputs:
      package_path:
        description: 'Path to FINAL package directory'
        required: false
        default: '.'

permissions:
  contents: read

concurrency:
  group: manifest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Python ${{ matrix.python-version }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Resolve package directory
        id: package
        shell: bash
        run: |
          requested="${{ github.event.inputs.package_path }}"
          echo "path=${requested:-.}" >> "$GITHUB_OUTPUT"

      - name: Copy package to temporary workspace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/package-under-test"
          cp -a "${{ steps.package.outputs.path }}/." "$RUNNER_TEMP/package-under-test/"
          rm -f "$RUNNER_TEMP/package-under-test/manifest.json"
          rm -f "$RUNNER_TEMP/package-under-test/Documentation/manifest.sha256"

      - name: Build manifest
        shell: bash
        run: |
          python Tools/build_manifest.py "$RUNNER_TEMP/package-under-test" \
            --schema "$GITHUB_WORKSPACE/Documentation/manifest.schema.json" \
            --validate --json > "build-manifest-python-${{ matrix.python-version }}.json"

      - name: Verify manifest and checksums
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          report="manifest-verification-python-${{ matrix.python-version }}.json"
          python Tools/verify_manifest.py "$RUNNER_TEMP/package-under-test" \
            --strict --json > "$report"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          cat "$report"
          exit 0

      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manifest-reports-python-${{ matrix.python-version }}
          path: |
            build-manifest-python-${{ matrix.python-version }}.json
            ${{ steps.verify.outputs.report }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce verifier exit code
        shell: bash
        run: |
          code="${{ steps.verify.outputs.exit_code }}"
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
